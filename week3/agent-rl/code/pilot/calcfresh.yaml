experiment_name: agent-rl-tools
trial_name: calcfresh
seed: 617
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 1
  n_gpus_per_node: 2
  fileroot: ${oc.env:AGENT_RL_ROOT}/runs
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:AGENT_RL_ROOT}/names
scheduler:
  type: local
rollout:
  backend: vllm:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 16
  queue_size: 64
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 512
  greedy: false
  temperature: 1.0
  max_tokens: 4096
actor:
  backend: fsdp:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:AGENT_RL_ROOT}/model
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 6.0e-06
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec: &id001
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}
    cpu: 2
  attn_impl: flash_attention_2
  weight_update_mode: xccl
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: *id001
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 4096
  gpu_memory_utilization: 0.6
  enforce_eager: true
train_dataset:
  batch_size: 8
  shuffle: true
  pin_memory: false
  num_workers: 0
  path: openai/gsm8k
  type: rl
  max_length: 1024
  scheduling_spec: null
valid_dataset:
  batch_size: 8
  pin_memory: false
  num_workers: 0
  path: openai/gsm8k
  type: rl
  scheduling_spec: null
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 8
  freq_secs: null
  eval_before_train: true
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: true
  session_tracer:
    enabled: true
total_train_steps: 24
tir:
  max_turns: 4
  max_length: 3000
  tool_timeout: 10
  enable_tools: calculator
  is_chat_model: true
